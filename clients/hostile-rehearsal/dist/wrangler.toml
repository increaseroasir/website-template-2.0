name = "smoky-mountain-superstore"
compatibility_date = "2026-07-20"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "smoky_inventory"
database_id = "00000000-0000-4000-8000-000000000000"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "smoky-assets"

[vars]
ALLOWED_ORIGIN = "https://smoky-mountain-superstore.example.com"
CLIENT_NAME = "Smoky Mountain Hot Tub & Swim Spa Superstore of Greater Knoxville"
CLIENT_WEBSITE_URL = "https://example-smoky-mountain-spas.com"
CLIENT_PHONE = "865-555-0142"
CLIENT_PHONE_E164 = "+18655550142"
R2_PUBLIC_BUCKET_ID = "pub-0000000000000000"
MAX_PRODUCT_IMAGE_BYTES = "6291456"
LEAD_VALUE = "950"
LEAD_CURRENCY = "USD"
# GHL calendar for /book/ — empty = booking page runs in request-mode (still captures leads)
GHL_BOOKING_CALENDAR_ID = ""

# Secrets set per client with wrangler pages secret put:
# GHL_API_TOKEN
# GHL_LOCATION_ID
# GOOGLE_SHEETS_ID
# GOOGLE_SERVICE_ACCOUNT_EMAIL
# GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
# META_CAPI_ACCESS_TOKEN
# META_PIXEL_ID
# TURNSTILE_SECRET_KEY
# ADMIN_PASSWORD
# ADMIN_SESSION_SECRET
# ALERT_EMAIL
# RESEND_API_KEY (optional)
